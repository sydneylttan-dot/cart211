<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Video</title>

    <style>
        /* REMOVES DEFAULT SPACING AND MAKES THE PAGE FILL THE SCREEN */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: white;
            background-color: black;
        }

        .background-video{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* FITS THE SCREEN WITHOUT STRETCHING THE VIDEO */
            object-position: center;
            z-index: -1;
        }

        /* ADDS A DARK OVERLAY TO MAKE THE TEXT EASIER TO READ */
        .overlay{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .content{
            position: relative;
            z-index: 1;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center; /* CENTER CONTENT VERTICALLY */
            align-content: center; /* CENTERS CONTENT HORIZONTALLY */
            text-align: center;
            padding: 20px;
        }

        /* CLAMP FUNCTION TAKES 3 VALUES - CLAMP(MIN, PREF, MAX) */
        h1{
            font-size: clamp(2rem, 5w, 4rem);
            margin-bottom: 15px;
        }

        p{
            font-size: 1.2rem;
        }
    </style>
    
</head>
<body>

    <video class="background-video"
    autoplay
    muted
    loop
    playinline
    aria-hidden="true"
    tabindex="-1">

    <source src="video.mp4" type="video/mp4">
    Your browser does not support background video
    </video>

    <!-- Darkens the bg video so the text is readable -->
    <div class="overlay">
        <main class="content">
            <h1> Snowy Video </h1>
            <p> Snow </p>
        </main>

    </div>
    
</body>
</html>
